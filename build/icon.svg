<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2a3142"/>
      <stop offset="1" stop-color="#0b0e15"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#sh)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <!-- frame guides: the three horizontal thirds -->
    <line x1="100" y1="374.7" x2="924" y2="374.7" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>
    <line x1="100" y1="649.3" x2="924" y2="649.3" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>
    <rect x="160" y="160" width="704" height="704" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6" stroke-dasharray="26 20"/>
    <!-- the lower third -->
    <rect x="210" y="580" width="40" height="230" rx="10" fill="url(#amber)"/>
    <rect x="280" y="580" width="500" height="118" rx="22" fill="url(#bar)"/>
    <rect x="280" y="722" width="330" height="88" rx="20" fill="#94a3b8" fill-opacity="0.85"/>
    <!-- motion streaks -->
    <rect x="808" y="620" width="70" height="38" rx="19" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="638" y="748" width="56" height="36" rx="18" fill="#94a3b8" fill-opacity="0.4"/>
  </g>
</svg>
