name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Mac app ships an LGPL-only ffmpeg (no libx264); ffmpeg-static's binary is a GPL build.
      - run: brew install nasm pkg-config
      - uses: actions/cache@v4
        id: ffcache
        with:
          path: ffmpeg-lgpl
          key: ffmpeg-lgpl-${{ hashFiles('scripts/build-ffmpeg-lgpl.sh') }}
      - if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          scripts/build-ffmpeg-lgpl.sh arm64 "$PWD/ffmpeg-lgpl/arm64/ffmpeg"
          scripts/build-ffmpeg-lgpl.sh x86_64 "$PWD/ffmpeg-lgpl/x64/ffmpeg"
      # Apple Silicon build
      - run: |
          cp ffmpeg-lgpl/arm64/ffmpeg node_modules/ffmpeg-static/ffmpeg && file node_modules/ffmpeg-static/ffmpeg
          node_modules/ffmpeg-static/ffmpeg -hide_banner -L | grep -q "Lesser General Public"
      - run: npx electron-builder --mac dmg --arm64 --publish never
      # Intel build: swap in the x64 binary
      - run: cp ffmpeg-lgpl/x64/ffmpeg node_modules/ffmpeg-static/ffmpeg && file node_modules/ffmpeg-static/ffmpeg
      - run: npx electron-builder --mac dmg --x64 --publish never
      - run: |
          ls -la dist
          codesign -dv dist/mac-arm64/Thirdline.app
          codesign -dv dist/mac/Thirdline.app
          hdiutil verify dist/Thirdline-*-arm64.dmg
          hdiutil attach -nobrowse -mountpoint /tmp/tl dist/Thirdline-*-arm64.dmg && ls -la /tmp/tl && hdiutil detach /tmp/tl
      - uses: actions/upload-artifact@v4
        with:
          name: thirdline-mac
          path: dist/*.dmg
          compression-level: 0
      - name: Publish release with the installers
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          NOTES="Mac installers. Apple Silicon (M1–M4): Thirdline-*-arm64.dmg. Intel: Thirdline-*-x64.dmg. First launch: right-click the app and choose Open (or System Settings > Privacy & Security > Open Anyway)."
          gh release create "$TAG" dist/*.dmg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Thirdline $TAG" --notes "$NOTES" \
            || gh release upload "$TAG" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
  other:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: thirdline-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
