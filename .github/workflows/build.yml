name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Apple Silicon build (runner is arm64, so ffmpeg-static fetched the arm64 binary)
      - run: npx electron-builder --mac dmg --arm64 --publish never
      # Intel build: swap in the x64 ffmpeg binary first
      - run: |
          cd node_modules/ffmpeg-static && rm -f ffmpeg && npm_config_arch=x64 node install.js && file ffmpeg
      - run: npx electron-builder --mac dmg --x64 --publish never
      - run: |
          ls -la dist
          codesign -dv dist/mac-arm64/Thirdline.app
          codesign -dv dist/mac/Thirdline.app
          hdiutil verify dist/Thirdline-*-arm64.dmg
          hdiutil attach -nobrowse -mountpoint /tmp/tl dist/Thirdline-*-arm64.dmg && ls -la /tmp/tl && hdiutil detach /tmp/tl
      - uses: actions/upload-artifact@v4
        with:
          name: thirdline-mac
          path: dist/*.dmg
          compression-level: 0
      - name: Publish release with the installers
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --repo "$GITHUB_REPOSITORY" --title "Thirdline $GITHUB_REF_NAME" --notes "Mac installers. Apple Silicon (M1–M4): Thirdline-*-arm64.dmg. Intel: Thirdline-*-x64.dmg." || gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
  other:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: thirdline-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
