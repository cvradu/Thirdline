<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Thirdline live</title>
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
    #status { position: fixed; left: 12px; top: 10px; font: 12px -apple-system, sans-serif; color: #fff; background: #000a; padding: 4px 8px; border-radius: 4px; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div id="status">Waiting for Thirdline…</div>
  <script src="/app/easing.js"></script>
  <script src="/app/presets.js"></script>
  <script src="/app/engine.js"></script>
  <script src="/live/live.js"></script>
</body>
</html>
