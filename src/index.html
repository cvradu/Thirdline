<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; font-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Thirdline</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">▁▃</span> Thirdline</div>
    <div class="topbar-group">
      <button id="btnNew" title="New project (Cmd/Ctrl+N)">New</button>
      <button id="btnOpen" title="Open a .l3rd project (Cmd/Ctrl+O)">Open…</button>
      <button id="btnSave" title="Save project as .l3rd (Cmd/Ctrl+S)">Save</button>
      <span class="docname" id="docName">Untitled</span>
    </div>
    <div class="topbar-group">
      <label class="lbl">Style</label>
      <select id="presetSelect"></select>
      <button id="btnSavePreset" title="Save the current design to your style list">Save style</button>
      <button id="btnDeletePreset" title="Delete selected saved style">Delete</button>
    </div>
    <div class="topbar-group">
      <label class="chk adv-toggle" title="Show keyframe controls, layer transforms, masks and text animators"><input type="checkbox" id="optAdvanced" /> Advanced</label>
      <button id="btnUndo" title="Undo (Ctrl/Cmd+Z)">↶</button>
      <button id="btnRedo" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>
      <button id="btnExport" class="primary">Export…</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel" id="leftPanel">
      <nav class="tabs" data-for="left">
        <button data-tab="text" class="active">Text</button>
        <button data-tab="backdrop">Backdrop</button>
        <button data-tab="layout">Layout</button>
      </nav>
      <div class="tab-body" id="leftBody"></div>
    </aside>

    <section class="stage">
      <div class="stage-toolbar">
        <label class="lbl">Background</label>
        <select id="bgMode">
          <option value="checker">Checkerboard</option>
          <option value="dark">Dark</option>
          <option value="mid">Grey</option>
          <option value="light">Light</option>
          <option value="green">Green</option>
          <option value="custom">Custom colour…</option>
          <option value="image">Reference image…</option>
        </select>
        <input type="file" id="bgFile" accept="image/*" hidden />
        <input type="color" id="bgColor" value="#1e3a8a" hidden title="Preview background colour" />
        <div class="layer-chips" title="Select a layer (or click it in the preview)">
          <button data-layer="backdrop">Backdrop</button><button data-layer="title">Title</button><button data-layer="subtitle">Subtitle</button>
        </div>
        <label class="chk"><input type="checkbox" id="optSafe" checked /> Safe areas</label>
        <label class="chk"><input type="checkbox" id="optBounds" /> Bounds</label>
        <span class="hint">Click a layer to edit it · drag to move</span>
      </div>
      <div class="viewport" id="viewport">
        <div class="frame" id="frame">
          <div class="frame-bg" id="frameBg"></div>
          <canvas id="preview"></canvas>
        </div>
      </div>
      <div class="transport">
        <button id="btnStart" title="Go to start (Home)">⏮</button>
        <button id="btnPrevFrame" title="Previous frame (←)">◀︎|</button>
        <button id="btnPlay" class="play" title="Play / pause (Space)">▶</button>
        <button id="btnNextFrame" title="Next frame (→)">|▶︎</button>
        <button id="btnHold" title="Jump to the fully-on frame">Hold</button>
        <label class="chk"><input type="checkbox" id="optLoop" checked /> Loop</label>
        <span class="timecode" id="timecode">00:00:00</span>
        <input type="range" id="scrub" min="0" max="1" step="0.0001" value="0" />
      </div>
      <div class="keybar" id="keyBar" hidden>
        <b id="kbLabel"></b>
        <span id="kbKeyCtl" class="kbgroup">
          <span class="muted">at</span> <span id="kbTime" class="timecode" style="min-width:0"></span>
          <label class="lbl">Value</label> <input id="kbValue" type="number" step="any" />
          <label class="lbl">Ease to next</label> <select id="kbEase"></select>
        </span>
        <span id="kbPreCtl" class="kbgroup" hidden>
          <select id="kpType" title="Animation type"></select>
          <label class="lbl">Duration</label> <input id="kpDur" type="number" step="0.05" min="0.05" title="Seconds" />
          <label class="lbl">Easing</label> <select id="kpEase"></select>
          <button id="kpConvert">Convert to keyframes</button>
        </span>
        <button id="kbGraph" title="Edit the easing curve (or double-click the keyframe)">Graph…</button>
        <button id="kbPrev" title="Previous keyframe (J)">◀◆</button><button id="kbNext" title="Next keyframe (K)">◆▶</button>
        <button id="kbDelete" title="Delete keyframe (Delete)">Delete</button>
      </div>
      <canvas id="timeline" height="120"></canvas>
    </section>

    <aside class="panel" id="rightPanel">
      <nav class="tabs" data-for="right">
        <button data-tab="anim-backdrop" class="active">Backdrop anim</button>
        <button data-tab="anim-title">Title anim</button>
        <button data-tab="anim-subtitle">Subtitle anim</button>
      </nav>
      <div class="tab-body" id="rightBody"></div>
    </aside>
  </main>

  <dialog id="graphDialog" class="graph-dlg">
    <div class="modal">
      <h2>Graph editor · <span id="gTitle"></span></h2>
      <canvas id="graphCanvas"></canvas>
      <div class="graph-ctl">
        <label class="lbl">Easing</label> <select id="gEase"></select>
        <span class="bez-in">
          <input id="gX1" type="number" step="0.01" min="0" max="1" title="Handle 1 · time (0–1)" />
          <input id="gY1" type="number" step="0.01" title="Handle 1 · value" />
          <input id="gX2" type="number" step="0.01" min="0" max="1" title="Handle 2 · time (0–1)" />
          <input id="gY2" type="number" step="0.01" title="Handle 2 · value" />
        </span>
      </div>
      <p class="muted" id="gNote"></p>
      <div class="actions">
        <button type="button" id="gPlay">▶ Preview</button>
        <button type="button" id="gClose" class="primary">Done</button>
      </div>
    </div>
  </dialog>
  <dialog id="exportDialog">
    <form method="dialog" class="modal">
      <h2>Export</h2>
      <div class="formats" id="formatList">
        <label><input type="radio" name="fmt" value="prores" checked /> <b>MOV · ProRes 4444</b><small>Alpha channel. Best for Premiere, Final Cut, Resolve, After Effects.</small></label>
        <label><input type="radio" name="fmt" value="webm" /> <b>WebM · VP9</b><small>Alpha channel. Small files, for web players, OBS and browsers.</small></label>
        <label><input type="radio" name="fmt" value="png" /> <b>PNG sequence</b><small>Alpha channel. One PNG per frame, works everywhere.</small></label>
        <label><input type="radio" name="fmt" value="mp4" /> <b>MP4 · H.264</b><small>No alpha. Rendered over the colour below.</small></label>
      </div>
      <div class="row"><label>File name</label><input type="text" id="exportName" value="lower-third" /></div>
      <div class="row" id="mp4BgRow"><label>Background (MP4)</label><input type="color" id="exportBg" value="#00b140" /></div>
      <p class="muted" id="exportSummary"></p>
      <div class="progress" id="exportProgress" hidden><div class="bar"></div><span></span></div>
      <p class="error" id="exportError" hidden></p>
      <div class="actions">
        <button type="button" id="btnExportCancel">Close</button>
        <button type="button" id="btnReveal" hidden>Show in folder</button>
        <button type="button" id="btnExportGo" class="primary">Choose location &amp; export</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="easing.js"></script>
  <script src="engine.js"></script>
  <script src="presets.js"></script>
  <script src="app.js"></script>
</body>
</html>
